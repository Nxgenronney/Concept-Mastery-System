name: Comprehensive Backend Regression & Content Safety Tests

on:
  push:
    branches:
      - feat/explicit-content-safeguard
      - main
  pull_request:

jobs:
  backend-and-safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concept-mastery/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: concept-mastery/backend/requirements.txt

      - name: Set up Node.js for Frontend Validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Frontend JavaScript Syntax
        run: |
          node -c ../frontend/js/api.js
          node -c ../frontend/js/app.js

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Full Pytest Regression Suite
        env:
          PYTHONPATH: .
          OFFLINE_TEST: "1"
          ENVIRONMENT: "test"
          JWT_SECRET: "ci-test-jwt-secret-key-32bytes-ci"
        run: |
          python -m pytest tests/ -v
